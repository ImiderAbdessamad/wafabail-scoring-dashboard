services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: wafabail-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: wafabail-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo "Attente MinIO…"
          sleep 2
        done
        mc mb -p local/wafabail-dossiers || true
        mc anonymous set download local/wafabail-dossiers || true
        echo "Bucket wafabail-dossiers prêt"
        exit 0
    restart: "no"

  kafka:
    image: apache/kafka:3.8.0
    container_name: wafabail-kafka
    hostname: kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: Mk3OEYBSD34fcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ./backend
    container_name: wafabail-api
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: wafabail-dossiers
      MINIO_SECURE: "false"
      DOSSIERS_STORE_PATH: /data/dossiers.json
      STORAGE_BACKEND: minio
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_DOSSIERS: wafabail.dossiers.created
      KAFKA_TOPIC_SCORING: wafabail.scoring.events
      OLLAMA_URL: https://ollama-lnhh4y-11434.svc-usw2.nicegpu.com
      RCC_OLLAMA_URL: https://ollama-lnhh4y-11434.svc-usw2.nicegpu.com
      RCC_VISION_MODEL: "hf.co/unsloth/GLM-4.6V-Flash-GGUF:Q4_K_M"
      RCC_OCR_MODEL: glm-ocr:q8_0
      RCC_VERIFY_MODEL: qwen3-vl:30b
      RCC_MAPPER_MODEL: qwen3.5:9b
      RCC_ADJUDICATOR_MODEL: gemma4:latest
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - api_data:/data

  dossier-worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    container_name: wafabail-dossier-worker
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_DOSSIERS: wafabail.dossiers.created
      KAFKA_CONSUMER_GROUP: wafabail-dossier-worker
    restart: unless-stopped

  scoring-worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    container_name: wafabail-scoring-worker
    command: ["python", "-u", "worker/scoring_worker.py"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_SCORING: wafabail.scoring.events
      KAFKA_CONSUMER_GROUP: wafabail-scoring-worker
    restart: unless-stopped

volumes:
  minio_data:
  api_data:
  kafka_data:
